name: CI/CD Pipeline to ACR & Azure App Service

on:
  push:
    branches: [ main ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies & Test
        run: |
          npm ci
          npm run build --if-present

      - name: Install Backend Dependencies & Test
        run: |
          cd my-backend
          npm ci
          npm run build --if-present
          cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Images
        run: |
          # Build and push Backend image to ACR
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:latest ./my-backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:latest

          # Build and push Frontend image to ACR with live backend URL build-args
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="https://backendnextjs-webapp-gtgsc2dbduhmh9e0.westus3-01.azurewebsites.net/api/v1" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://backendnextjs-webapp-gtgsc2dbduhmh9e0.westus3-01.azurewebsites.net/api/v1" \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest

  deploy-frontend:
    needs: build-test-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontendnextjs-webapp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest'