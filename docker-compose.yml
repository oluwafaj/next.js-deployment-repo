version: '3.8'

services:
  backend:
    build:
      context: ./my-backend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3002/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
